name: Build & Test

on:
  push:
    branches: [master, "1.21.x"]
  pull_request:
    branches: [master, "1.21.x"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build

      - name: Generate Data
        run: ./gradlew runData

      - name: Check for uncommitted datagen changes
        run: |
          git diff --exit-code -- 'src/generated/' || {
            echo "::error::Datagen output has drifted. Run ./gradlew runData and commit the changes."
            git diff -- 'src/generated/'
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifold-${{ github.sha }}
          path: |
            manifold/build/libs/*.jar
            manifold-api/build/libs/*.jar
