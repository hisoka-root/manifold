org.gradle.jvmargs=-Xmx4G -XX:+UseZGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# ── Minecraft / NeoForge version ─────────────────────────────────
#  To start a new branch for a different MC version:
#    1. Change minecraft_version and neoforge_version below
#    2. Update neoforge.mods.toml versionRange fields in both modules
#    3. Run ./gradlew runData to regenerate version-specific JSONs
#    4. Update the pack_format in pack.mcmeta (34 = 1.21.1, 48 = 1.21.4)
#  Branch strategy:  master (dev) → 1.21.x → 1.22.x → fabric/1.21.x
# ──────────────────────────────────────────────────────────────────
minecraft_version=1.21.1
neoforge_version=21.1.241
# ── Mod metadata ─────────────────────────────────────────────────
loader_version_range=[4,)
mod_version=0.1.0
mod_id=manifold
mod_group=lol.hisoka
mod_authors=hisoka
mod_name=Manifold
mod_description=A request-routed logistics network mod. Spiritual successor to Logistics Pipes.
license=manifold-api: MIT / manifold: MPL-2.0
